plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lewis.tvhome'
    compileSdk 34

    defaultConfig {
        applicationId 'com.lewis.tvhome'
        minSdk 23
        targetSdk 23
        versionCode 1
        versionName '0.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }
}

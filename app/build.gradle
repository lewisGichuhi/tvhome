plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lewis.tvhome'
    compileSdk 34

    defaultConfig {
        applicationId 'com.lewis.tvhome'
        minSdk 23
        targetSdk 23
        versionCode 1
        versionName '0.1'

        // TMDB token from local.properties (gitignored) -> BuildConfig.TMDB_READ_TOKEN
        def localProps = new Properties()
        def localFile = rootProject.file("local.properties")
        if (localFile.exists()) {
            localFile.withInputStream { localProps.load(it) }
        }
        buildConfigField "String", "TMDB_READ_TOKEN",
            "\"${localProps.getProperty('TMDB_READ_TOKEN', '')}\""
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }
}

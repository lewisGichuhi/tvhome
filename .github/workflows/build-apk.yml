name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Write local.properties (server only)
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}" >> local.properties

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.5 --distribution-type bin
        continue-on-error: true

      - name: Verify wrapper exists
        run: |
          if [ ! -f ./gradlew ]; then
            echo "Wrapper missing, falling back to system gradle"
            echo "USE_SYSTEM_GRADLE=1" >> $GITHUB_ENV
          else
            chmod +x ./gradlew
            echo "USE_SYSTEM_GRADLE=0" >> $GITHUB_ENV
          fi

      - name: Build debug APK (wrapper)
        if: env.USE_SYSTEM_GRADLE == '0'
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Build debug APK (system gradle)
        if: env.USE_SYSTEM_GRADLE == '1'
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
